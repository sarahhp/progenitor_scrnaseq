
global:
  - name: "load_libs"
    type: "dynamic"
    chunk_options: "message=FALSE, warning=FALSE"

params_block:
  type: "parameterized"
  content: |
    ```{r params}
    module = "{module}"
    dataname = "{dataname}"
    load_data = {load_data}
    subset_data = {subset_data}
    {optional_params}
    ```

setup_block:
  type: "parameterized"
  content: |
    ```{r setup}
    set.seed({seed})
    rmd_filename = "{rmd_filename}"
    fig_dir = file.path("analysis", module, dataname, "figures", rmd_filename)
    if (!dir.exists(fig_dir)) dir.create(fig_dir, recursive = TRUE)
    knitr::opts_chunk$set(fig.path = paste0(fig_dir, "/"),
                          dev = c("png","pdf"))
    ```

themes_block:
  type: "parameterized"
  content: |
    ```{r themes}
    theme_hp = theme_classic(base_size = 15) +
      theme(axis.line = element_line(linewidth = 0.25),
            axis.ticks = element_line(linewidth = 0.25),
            strip.background = element_blank())
    theme_set(theme_hp)
    pal = {pal}
    clusters = {clusters}
    ```

